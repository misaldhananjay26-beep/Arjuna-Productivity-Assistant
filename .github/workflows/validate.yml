name: Validate Arjuna

on:
  push:
    pull_request:

    jobs:
      validate:
          runs-on: ubuntu-latest
              steps:
                    - name: Check out repository
                            uses: actions/checkout@v4
                                  - name: Set up Node.js
                                          uses: actions/setup-node@v4
                                                  with:
                                                            node-version: 20
                                                                  - name: Validate browser JavaScript
                                                                          run: node --check app.js
                                                                                - name: Validate chat API JavaScript
                                                                                        run: node --check api/chat.js
                                                                                        
